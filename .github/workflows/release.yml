name: "publish"

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  ci-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            textlingo-desktop/package-lock.json
            textlingo-desktop/agent-worker/package-lock.json

      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ./textlingo-desktop

      - name: Install agent worker dependencies
        run: npm ci
        working-directory: ./textlingo-desktop/agent-worker

      - name: Test agent worker
        run: npm test
        working-directory: ./textlingo-desktop/agent-worker

      - name: Stage bundled agent worker
        run: npm run stage
        working-directory: ./textlingo-desktop/agent-worker

      - name: Typecheck
        run: npm run typecheck
        working-directory: ./textlingo-desktop

      - name: Download sidecar binaries
        run: |
          chmod +x script/download_binaries.sh
          bash script/download_binaries.sh

      - name: build bundled PDF sidecar
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -e ./textlingo-desktop/pdf-sidecar
          cd textlingo-desktop/pdf-sidecar
          python build.py
          cd ../..
          chmod +x script/sync_pdf_sidecar_binaries.sh
          bash script/sync_pdf_sidecar_binaries.sh
        shell: bash
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"

      - name: verify bundled PDF sidecar
        run: |
          bash script/sync_pdf_sidecar_binaries.sh
          bash script/verify_pdf_sidecar_binary.sh
          ls -la textlingo-desktop/src-tauri/binaries
        shell: bash

      - name: Prepare frontend dist for Tauri context
        run: mkdir -p textlingo-desktop/dist

      - name: Rust tests
        run: cargo test --all-features --all-targets
        working-directory: ./textlingo-desktop/src-tauri

      - name: Frontend coverage gate (>=80%)
        run: npm run coverage
        working-directory: ./textlingo-desktop

  publish-tauri:
    needs: ci-gate
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-14"
            args: "--target aarch64-apple-darwin --bundles app,dmg"
          - platform: "macos-15-intel"
            args: "--target x86_64-apple-darwin --bundles app,dmg"
          - platform: "ubuntu-22.04"
            args: "--target x86_64-unknown-linux-gnu --bundles deb"
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install system dependencies (linux only)
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: install dependencies (macos only)
        if: startsWith(matrix.platform, 'macos-')
        run: brew install create-dmg

      - name: import Apple Developer ID certificate (macos only)
        if: startsWith(matrix.platform, 'macos-')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain

      - name: prepare Apple notarization key (macos only)
        if: startsWith(matrix.platform, 'macos-')
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          echo "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/private_keys/AuthKey_${{ secrets.APPLE_API_KEY }}.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/private_keys/AuthKey_${{ secrets.APPLE_API_KEY }}.p8" >> "$GITHUB_ENV"

      - name: install frontend dependencies
        run: npm install
        working-directory: ./textlingo-desktop

      - name: install agent worker dependencies
        run: npm ci
        working-directory: ./textlingo-desktop/agent-worker

      - name: stage bundled agent worker
        run: npm run stage
        working-directory: ./textlingo-desktop/agent-worker

      - name: download sidecar binaries
        run: |
          chmod +x script/download_binaries.sh
          bash script/download_binaries.sh
        shell: bash

      - name: build bundled PDF sidecar
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -e ./textlingo-desktop/pdf-sidecar
          cd textlingo-desktop/pdf-sidecar
          python build.py
          cd ../..
          chmod +x script/sync_pdf_sidecar_binaries.sh
          bash script/sync_pdf_sidecar_binaries.sh
        shell: bash
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"

      - name: verify bundled PDF sidecar
        run: |
          bash script/sync_pdf_sidecar_binaries.sh
          bash script/verify_pdf_sidecar_binary.sh
          ls -la textlingo-desktop/src-tauri/binaries
        shell: bash

      - name: stage PDF offline assets
        run: python script/build_pdf_offline_assets.py
        shell: bash

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "OpenKoto Desktop ${{ github.ref_name }}"
          releaseBody: |
            ## Release Highlights
            - OpenKoto Cloud: sign in with your OpenKoto account (Settings → Account & Sync) to sync vocabulary, books, lyrics and reading progress across desktop, web and iPhone. Changes arrive in real time, and your data stays local-first in a new SQLite store.
            - Membership: your Free / Plus / Pro plan is shown in the app; upgrade, buy AI credits or redeem an activation code at openkoto.com/account.
            - Account-switch guard: signing in to a different account asks whether to upload this computer's data or keep it local-only.
            - Import Bilibili videos by link.
            - New Meta AI (Muse Spark) API provider.
            - Linux: .deb packages for x86_64.

            ## Improved
            - MKV/AVI videos are remuxed to MP4 on import, and the player gains keyboard shortcuts.

            ## Fixed
            - Fixed mind map generation in release builds.
            - Fixed Meta AI model selection not being remembered.

            > Desktop version `${{ github.ref_name }}`. Multi-platform release publishing remains tag-driven through this workflow.
          releaseDraft: false
          prerelease: false
          projectPath: "./textlingo-desktop"
          args: ${{ matrix.args }}

      - name: assert packaged runtimes and PDF entitlements (macos only)
        if: startsWith(matrix.platform, 'macos-')
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find textlingo-desktop/src-tauri/target -type d -name "*.app" -path "*/release/bundle/macos/*" | head -1)
          if [ -z "$APP" ]; then echo "::error::No .app bundle found"; exit 1; fi
          APP=$(cd "$APP" && pwd)
          echo "App bundle: $APP"
          AGENT_NODE="$APP/Contents/MacOS/openkoto-agent-node"
          AGENT_WORKER="$APP/Contents/Resources/resources/agent-worker/dist/index.js"
          OPENCODE="$APP/Contents/MacOS/opencode"
          for REQUIRED in "$AGENT_NODE" "$AGENT_WORKER" "$OPENCODE"; do
            if [ ! -f "$REQUIRED" ]; then
              echo "::error::Agent worker runtime not found at $REQUIRED"
              find "$APP/Contents" -maxdepth 5 -type f | sort
              exit 1
            fi
          done
          "$AGENT_NODE" --version
          WORKER_SMOKE=$(cd "$(dirname "$AGENT_WORKER")/.." && "$AGENT_NODE" dist/index.js </dev/null)
          echo "$WORKER_SMOKE"
          if ! grep -q '"event":"worker.ready"' <<<"$WORKER_SMOKE"; then
            echo "::error::Packaged agent worker did not emit worker.ready"
            exit 1
          fi
          SIDECAR="$APP/Contents/MacOS/openkoto-pdf-translator"
          if [ ! -f "$SIDECAR" ]; then
            echo "::error::PDF sidecar not found at $SIDECAR"
            ls -la "$APP/Contents/MacOS" || true
            exit 1
          fi
          echo "--- signature ---"
          codesign -dvvv "$SIDECAR" 2>&1 | grep -iE "TeamIdentifier|Authority=|Signature" || true
          echo "--- entitlements ---"
          ENTS=$(codesign -d --entitlements - --xml "$SIDECAR" 2>/dev/null || codesign -d --entitlements - "$SIDECAR" 2>/dev/null || true)
          echo "$ENTS"
          if echo "$ENTS" | grep -q "disable-library-validation"; then
            echo "OK: disable-library-validation present on PDF sidecar"
          else
            echo "::error::disable-library-validation entitlement missing on PDF sidecar — PDF translation will fail at runtime"
            exit 1
          fi

      - name: assert packaged agent worker runtimes (windows only)
        if: startsWith(matrix.platform, 'windows-')
        shell: bash
        run: |
          set -euo pipefail
          TARGET_DIR=$(cd textlingo-desktop/src-tauri/target/release && pwd)
          echo "Target dir: $TARGET_DIR"
          AGENT_NODE="$TARGET_DIR/openkoto-agent-node.exe"
          AGENT_WORKER="$TARGET_DIR/resources/agent-worker/dist/index.js"
          OPENCODE="$TARGET_DIR/opencode.exe"
          for REQUIRED in "$AGENT_NODE" "$AGENT_WORKER" "$OPENCODE"; do
            if [ ! -f "$REQUIRED" ]; then
              echo "::error::Agent worker runtime not found at $REQUIRED"
              find "$TARGET_DIR" -maxdepth 4 -type f | sort
              exit 1
            fi
          done
          "$AGENT_NODE" --version
          WORKER_SMOKE=$(cd "$(dirname "$AGENT_WORKER")/.." && "$AGENT_NODE" dist/index.js </dev/null)
          echo "$WORKER_SMOKE"
          if ! grep -q '"event":"worker.ready"' <<<"$WORKER_SMOKE"; then
            echo "::error::Packaged agent worker did not emit worker.ready"
            exit 1
          fi

      - name: assert packaged runtimes and Linux bundles (linux only)
        if: startsWith(matrix.platform, 'ubuntu-')
        shell: bash
        run: |
          set -euo pipefail
          TARGET_DIR=$(cd textlingo-desktop/src-tauri/target/x86_64-unknown-linux-gnu/release && pwd)
          echo "Target dir: $TARGET_DIR"
          AGENT_NODE="$TARGET_DIR/openkoto-agent-node"
          OPENCODE="$TARGET_DIR/opencode"
          SIDECAR="$TARGET_DIR/openkoto-pdf-translator"
          for REQUIRED in "$AGENT_NODE" "$OPENCODE" "$SIDECAR"; do
            if [ ! -f "$REQUIRED" ]; then
              echo "::error::Packaged runtime not found at $REQUIRED"
              find "$TARGET_DIR" -maxdepth 2 -type f | sort
              exit 1
            fi
          done
          "$AGENT_NODE" --version
          WORKER_SMOKE=$(cd textlingo-desktop/src-tauri/resources/agent-worker && "$AGENT_NODE" dist/index.js </dev/null)
          echo "$WORKER_SMOKE"
          if ! grep -q '"event":"worker.ready"' <<<"$WORKER_SMOKE"; then
            echo "::error::Packaged agent worker did not emit worker.ready"
            exit 1
          fi
          DEB=$(find textlingo-desktop/src-tauri/target -type f -name "*.deb" -path "*/release/bundle/deb/*" | head -1)
          if [ -z "$DEB" ]; then echo "::error::No .deb bundle found"; exit 1; fi
          echo "Debian bundle: $DEB"
          DEB_CONTENTS=$(dpkg-deb -c "$DEB")
          for REQUIRED in "openkoto-agent-node" "opencode" "openkoto-pdf-translator" "agent-worker/dist/index.js"; do
            if ! grep -q "$REQUIRED" <<<"$DEB_CONTENTS"; then
              echo "::error::$REQUIRED missing from .deb bundle"
              echo "$DEB_CONTENTS"
              exit 1
            fi
          done
